name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Every top-level directory holding a Chart.yaml is a chart in this
      # repository. A chart that carries its own ci/render-check.sh is checked
      # with that script, which renders each profile and each subchart
      # standalone; anything else falls back to a plain lint. The install-time
      # checks are skipped here because `helm template` performs no lookups,
      # which is what lets this run without a cluster.
      - name: render and lint every chart
        run: |
          shopt -s nullglob
          found=false
          for manifest in */Chart.yaml; do
            dir=${manifest%/Chart.yaml}
            found=true
            echo "==> $dir"
            if [ -x "$dir/ci/render-check.sh" ]; then
              "$dir/ci/render-check.sh"
            else
              helm dependency build "$dir"
              helm lint "$dir"
            fi
          done
          if [ "$found" = false ]; then
            echo "no charts found at the repository root" >&2
            exit 1
          fi

  # The render job never meets a cluster, so the preflight lookups, the
  # post-install model puller and the helm tests never run there. This job gives
  # them one: a kind cluster, against which each chart's render-check.sh runs in
  # --server mode, and its install-check.sh, if it has one, installs a profile
  # and runs helm test.
  install:
    runs-on: ubuntu-latest
    needs: render
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: helm/kind-action@v1
        with:
          cluster_name: charts-ci

      # The GPU profiles name RuntimeClass nvidia, and the API server rejects a
      # pod naming one that does not exist, even under --dry-run=server. kind
      # has no nvidia runtime, but render-check.sh --server only dry-runs those
      # profiles, so a RuntimeClass by that name is all it needs. Nothing is ever
      # scheduled onto it; the install job runs the CPU profile.
      - name: stand-in nvidia RuntimeClass
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: nvidia
          handler: nvidia
          EOF

      - name: install and test every chart
        run: |
          shopt -s nullglob
          for manifest in */Chart.yaml; do
            dir=${manifest%/Chart.yaml}
            echo "==> $dir"
            if [ -x "$dir/ci/render-check.sh" ]; then
              "$dir/ci/render-check.sh" --server
            fi
            if [ -x "$dir/ci/install-check.sh" ]; then
              "$dir/ci/install-check.sh"
            fi
          done
