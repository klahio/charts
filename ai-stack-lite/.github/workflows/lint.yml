name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Renders every profile and each subchart standalone. The install-time
      # checks are skipped here because `helm template` performs no lookups,
      # which is what lets this run without a cluster.
      - name: render and lint
        run: ./ci/render-check.sh
