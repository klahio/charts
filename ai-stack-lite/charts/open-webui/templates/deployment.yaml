{{- include "common.preflight" . }}
{{- /* Same reasoning as the ComfyUI deployment: the data claim is
       ReadWriteOnce, so a RollingUpdate waits for a volume the outgoing pod
       still holds and the upgrade fails on the progress deadline. */}}
{{- if ne .Values.strategy.type "Recreate" }}
{{- fail (printf "\n\nai-stack-lite: open-webui.strategy.type is %q.\n\nThe Open WebUI data claim is ReadWriteOnce, so a RollingUpdate deadlocks: the\nnew pod cannot attach a claim the outgoing pod still holds.\n\nUse Recreate, or move persistence.data to ReadWriteMany storage first.\n" .Values.strategy.type) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.servingPodLabels" . | nindent 8 }}
      {{- /* Restart when the signing key changes, otherwise the running pod
             keeps using the old one. Assembled as a dict so that an unreadable
             existingSecret leaves out the annotation instead of emitting an
             empty one. */}}
      {{- $ann := deepCopy (default (dict) .Values.podAnnotations) }}
      {{- with include "open-webui.authChecksum" . }}
      {{- $_ := set $ann "checksum/auth" . }}
      {{- end }}
      {{- with $ann }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      {{- include "common.runtimeClassName" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "common.scheduling" . | nindent 6 }}
      containers:
        - name: open-webui
          image: {{ include "common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.ollama.enabled }}
            - name: OLLAMA_BASE_URL
              value: {{ include "open-webui.ollamaUrl" . | quote }}
            {{- end }}
            - name: ENABLE_SIGNUP
              value: {{ .Values.auth.enableSignup | quote }}
            {{- if .Values.imageGeneration.enabled }}
            - name: ENABLE_IMAGE_GENERATION
              value: "true"
            - name: IMAGE_GENERATION_ENGINE
              value: {{ .Values.imageGeneration.engine | quote }}
            {{- if eq .Values.imageGeneration.engine "comfyui" }}
            - name: COMFYUI_BASE_URL
              value: {{ include "open-webui.comfyuiUrl" . | quote }}
            - name: COMFYUI_WORKFLOW_NODES
              value: {{ .Values.imageGeneration.workflowNodes | toJson | quote }}
            {{- end }}
            - name: IMAGE_GENERATION_MODEL
              value: {{ .Values.imageGeneration.model | quote }}
            - name: IMAGE_SIZE
              value: {{ .Values.imageGeneration.size | quote }}
            - name: IMAGE_STEPS
              value: {{ .Values.imageGeneration.steps | quote }}
            {{- end }}
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-webui.secretName" . }}
                  key: WEBUI_SECRET_KEY
            {{- include "common.env" . | nindent 12 }}
          {{- include "common.probes" (dict "probes" .Values.probes "port" "http") | nindent 10 }}
          resources:
            {{- include "common.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "common.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "common.volumes" . | nindent 8 }}
