{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-auth" (include "common.fullname" .) }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
data:
  WEBUI_SECRET_KEY: {{ include "open-webui.secretKey" . | b64enc | quote }}
{{- end }}
