{{- include "common.preflight" . }}
{{- include "comfyui.checkPaths" . }}
{{- /* A RollingUpdate here starts the replacement pod before the old one is
       gone, and the claims are ReadWriteOnce, so the new pod waits for a volume
       the old one still holds until progressDeadlineSeconds expires and the
       upgrade fails. The value is left configurable for an image on RWX
       storage; it is checked so that setting it is a decision rather than a
       discovery. */}}
{{- if ne .Values.strategy.type "Recreate" }}
{{- fail (printf "\n\nai-stack-lite: comfyui.strategy.type is %q.\n\nThe ComfyUI volumes are ReadWriteOnce, so a RollingUpdate deadlocks: the new pod\ncannot attach a claim the outgoing pod still holds, and the upgrade fails when\nprogressDeadlineSeconds expires.\n\nUse Recreate, or move the claims to ReadWriteMany storage first and waive this\nwith comfyui.strategy.type set deliberately after changing accessMode.\n" .Values.strategy.type) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- /* First boot builds the virtualenv and fetches the models, which
         outruns the 600s default and fails `helm install --wait` on a
         deployment that is still progressing. */}}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.servingPodLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      {{- include "common.runtimeClassName" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "common.scheduling" . | nindent 6 }}
      {{- if or .Values.fixVolumeOwnership.enabled (and .Values.modelDownloader.enabled .Values.modelDownloader.models) }}
      initContainers:
        {{- if .Values.fixVolumeOwnership.enabled }}
        {{- include "common.chownInit" (dict "ctx" . "uid" .Values.podUser.uid "gid" .Values.podUser.gid "image" .Values.fixVolumeOwnership.image) | nindent 8 }}
        {{- end }}
        {{- if and .Values.modelDownloader.enabled .Values.modelDownloader.models }}
        - name: fetch-models
          image: {{ include "common.helperImage" (dict "ctx" . "image" .Values.modelDownloader.image) }}
          imagePullPolicy: IfNotPresent
          {{- /* Runs as root so the finished file can be handed to the uid the
                 image expects; ComfyUI's entrypoint refuses to start when a
                 model directory is owned by anyone else. */}}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - sh
            - -c
            - |
              set -e
              root={{ .Values.persistence.models.mountPath | quote }}
              {{- range .Values.modelDownloader.models }}
              dir="$root/{{ .dir }}"
              mkdir -p "$dir"
              if [ -s "$dir/{{ .name }}" ]; then
                echo "{{ .dir }}/{{ .name }} already present, skipping"
              else
                echo "fetching {{ .dir }}/{{ .name }}"
                {{- /* Download to a .part file and rename, so an interrupted
                       pull is retried rather than left as a truncated model
                       that only fails later, inside a workflow. */}}
                curl -fL --retry 5 --retry-delay 5 -o "$dir/{{ .name }}.part" {{ .url | quote }}
                mv "$dir/{{ .name }}.part" "$dir/{{ .name }}"
              fi
              chown {{ $.Values.podUser.uid }}:{{ $.Values.podUser.gid }} "$dir/{{ .name }}"
              chmod 0664 "$dir/{{ .name }}"
              {{- /* Every level mkdir -p created, not just the leaf. A nested
                     dir such as "checkpoints/sdxl" otherwise leaves the
                     intermediate directory owned by root, and ComfyUI's
                     entrypoint refuses to start on a model tree it does not
                     own. */}}
              p="$dir"
              while [ "$p" != "$root" ] && [ "$p" != "/" ]; do
                chown {{ $.Values.podUser.uid }}:{{ $.Values.podUser.gid }} "$p"
                chmod 0775 "$p"
                p=$(dirname "$p")
              done
              {{- end }}
              echo "models ready"
          volumeMounts:
            {{- /* The same subPath the main container gets. Mounting the claim
                   root instead would write the checkpoints beside the subtree
                   ComfyUI reads, so the download succeeds and the checkpoint
                   list is still empty. */}}
            - name: models
              mountPath: {{ .Values.persistence.models.mountPath }}
              {{- with .Values.persistence.models.subPath }}
              subPath: {{ . }}
              {{- end }}
          resources:
            {{- toYaml .Values.modelDownloader.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: comfyui
          image: {{ include "common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8188
              protocol: TCP
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: LISTEN_PORT
              value: "8188"
            {{- with include "comfyui.baseDirectory" . }}
            - name: BASE_DIRECTORY
              value: {{ . | quote }}
            {{- end }}
            {{- with include "comfyui.cmdlineExtra" . }}
            - name: COMFY_CMDLINE_EXTRA
              value: {{ . | quote }}
            {{- end }}
            - name: WANTED_UID
              value: {{ .Values.podUser.uid | quote }}
            - name: WANTED_GID
              value: {{ .Values.podUser.gid | quote }}
            - name: SECURITY_LEVEL
              value: {{ .Values.securityLevel | quote }}
            - name: DISABLE_UPGRADES
              value: {{ .Values.disableUpgrades | quote }}
            {{- include "common.env" . | nindent 12 }}
          {{- include "common.probes" (dict "probes" .Values.probes "port" "http") | nindent 10 }}
          resources:
            {{- include "common.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "common.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "common.volumes" . | nindent 8 }}
