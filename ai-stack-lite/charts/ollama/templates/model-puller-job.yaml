{{- if and .Values.modelPuller.enabled .Values.modelPuller.models }}
{{/*
Runs after the StatefulSet is up and pulls the listed models into the shared
volume through the Ollama API, so no GPU and no second copy of the weights.

post-install only, not post-upgrade: re-running on every upgrade would re-check
every model against the registry and stall the release on a slow link.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.fullname" . }}-model-puller
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.modelPuller.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "common.podLabels" . | nindent 8 }}
        ai-stack-lite/job: model-puller
    spec:
      restartPolicy: OnFailure
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "common.serviceAccountName" . }}
      {{- include "common.scheduling" . | nindent 6 }}
      containers:
        - name: puller
          image: {{ include "common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: OLLAMA_HOST
              value: {{ printf "http://%s:%d" (include "common.fullname" .) (.Values.service.port | int) }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "waiting for ollama at $OLLAMA_HOST"
              # Bounded, and the bound is sized to fire inside helm's default
              # timeout. An unbounded loop would hang this hook, and the hook
              # blocks the install, until helm gave up and reported only that
              # the hook did not complete - with no indication that the API
              # never answered. See modelPuller.waitAttempts in values.yaml for
              # how this interacts with backoffLimit and --timeout.
              i=0
              until ollama list >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge {{ .Values.modelPuller.waitAttempts | int }} ]; then
                  echo "FAIL: no answer from the ollama API at $OLLAMA_HOST after $((i * 3))s." >&2
                  echo "The StatefulSet is probably not Ready. Check it with:" >&2
                  echo "  kubectl -n {{ .Release.Namespace }} describe statefulset {{ include "common.fullname" . }}" >&2
                  exit 1
                fi
                sleep 3
              done
              {{- range .Values.modelPuller.models }}
              echo "pulling {{ . }}"
              ollama pull {{ . | quote }}
              {{- end }}
              echo "done"
              ollama list
          resources:
            {{- toYaml .Values.modelPuller.resources | nindent 12 }}
{{- end }}
