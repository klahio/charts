apiVersion: v2
name: ai-stack-lite
description: Self-hosted AI stack for on-prem Kubernetes - Ollama for LLM inference, Open WebUI as the chat frontend, ComfyUI for image generation.
type: application
version: 0.2.0
appVersion: "0.2.0"
kubeVersion: ">=1.24.0-0"
keywords: [ai, llm, ollama, open-webui, comfyui, gpu, on-prem, self-hosted]
home: https://github.com/klahio/charts/tree/main/ai-stack-lite
icon: https://raw.githubusercontent.com/klahio/charts/main/ai-stack-lite/icon.svg
sources:
  - https://github.com/klahio/charts/tree/main/ai-stack-lite
  - https://github.com/ollama/ollama
  - https://github.com/open-webui/open-webui
  - https://github.com/comfyanonymous/ComfyUI
maintainers:
  - name: klahio
    url: https://github.com/klahio
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/links: |
    - name: source
      url: https://github.com/klahio/charts/tree/main/ai-stack-lite
    - name: GPU setup notes
      url: https://github.com/klahio/charts/tree/main/ai-stack-lite#gpu-setup
  artifacthub.io/images: |
    - name: ollama
      image: ollama/ollama:0.40.6
    - name: open-webui
      image: ghcr.io/open-webui/open-webui:0.12.3
    - name: comfyui
      image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.4-20261018
  artifacthub.io/changes: |
    - kind: added
      description: A default install now arrives with a model - Ollama pulls llama3.2:3b and ComfyUI fetches an SD 1.5 checkpoint
    - kind: added
      description: Open WebUI is wired to the stack's ComfyUI, so image generation works without manual admin settings
    - kind: fixed
      description: ComfyUI no longer overruns the deployment progress deadline while it builds its virtualenv on a fresh volume
dependencies:
  # Library chart. Renders nothing on its own; it carries the template helpers
  # the three component charts share. Declared here as well as in each subchart
  # so helm lint sees every directory under charts/ accounted for.
  - name: common
    version: 0.1.0
    repository: ""
  - name: ollama
    version: 0.2.0
    repository: ""
    condition: ollama.enabled
  - name: open-webui
    version: 0.2.0
    repository: ""
    condition: open-webui.enabled
  - name: comfyui
    version: 0.2.0
    repository: ""
    condition: comfyui.enabled
